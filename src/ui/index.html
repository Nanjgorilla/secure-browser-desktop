<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>セキュアブラウザ</title><link rel="stylesheet" href="ui.css"></head><body>
<div id="tabbar"><div id="tabs"></div><button id="newtab" title="新しいタブ (Ctrl+T)">＋</button></div>
<div id="toolbar">
<button id="back" title="戻る">◀</button><button id="fwd" title="進む">▶</button><button id="reload" title="再読み込み (Ctrl+R)">⟳</button><button id="home" title="ホーム">⌂</button>
<form id="f"><span id="lock">🔒</span><input id="addr" spellcheck="false" autocomplete="off" placeholder="URLを入力、またはDuckDuckGoで検索"></form>
<span id="shield" title="ブロックした広告・トラッカーの数">🛡 <b id="cnt">0</b></span>
<button id="clear" title="閲覧データを削除">🧹</button></div>
<div id="toast"></div><script src="ui.js"></script></body></html>
